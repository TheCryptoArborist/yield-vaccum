name: Prepare Quests runtime dependency patches
on:
  push:
    branches: [feature/mss2-quests-foundation]
    paths: [.github/workflows/prepare-quest-runtime-patches.yml]
permissions:
  contents: read
jobs:
  patch:
    if: github.ref == 'refs/heads/feature/mss2-quests-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/mss2-quests-foundation
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply targeted runtime fixes without forced majors or compiler changes
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 ethers@6.17.0
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.4.3
          npm update --package-lock-only --ignore-scripts source-map-js zod
          npm ci
      - name: Audit actual locked runtime dependencies
        run: |
          mkdir -p quest-security-review
          npm audit --omit=dev --json > quest-security-review/audit-runtime.json || test "$?" = 1
          npm audit --json > quest-security-review/audit-all.json || test "$?" = 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const kind of ['runtime','all']) {
            const audit=JSON.parse(fs.readFileSync(`quest-security-review/audit-${kind}.json`));
            if(audit.error)throw new Error('Audit request failed');
            console.log('AUDIT_'+kind.toUpperCase(),JSON.stringify({counts:audit.metadata?.vulnerabilities,packages:Object.values(audit.vulnerabilities??{}).map(v=>({name:v.name,severity:v.severity,fix:v.fixAvailable}))}));
          }
          NODE
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Save manifests to the review branch only and remove this temporary workflow
        run: |
          test "$(git branch --show-current)" = feature/mss2-quests-foundation
          git add package.json package-lock.json
          git rm .github/workflows/prepare-quest-runtime-patches.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Resolve runtime audit findings for the Quests preview'
          git push origin HEAD:refs/heads/feature/mss2-quests-foundation
      - name: Retain dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quests-runtime-audit
          path: quest-security-review/
          retention-days: 7

name: Daily Draw historical provider evidence
on:
  push:
    branches: [research/mss2-daily-draw-readiness]
    paths: [.github/workflows/daily-draw-provider-evidence.yml]
permissions: {}
concurrency:
  group: daily-draw-provider-evidence
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch pinned read-only checker and isolated dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-evidence"
          cd "$RUNNER_TEMP/provider-evidence"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 https://raw.githubusercontent.com/TheCryptoArborist/yield-vaccum/32b0d96f1d7e065f7a4b83b3023e7744d0720f47/scripts/daily-draw-provider-evidence.mjs -o verify.mjs
          test "$(git hash-object verify.mjs)" = 32118afea1081324039f0a947fba649f1f17aedd
          node --check verify.mjs
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact ethers@6.15.0 @d20dao/vrf-sdk@0.6.2
      - name: Verify historical proofs with additional read pacing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/provider-evidence"
          cat > paced-runner.mjs <<'JS'
          import {setTimeout as delay} from 'node:timers/promises';
          // Only add delay. Do not reroute, filter, rewrite or synthesize request/response data.
          // The imported pinned script still enforces host/method restrictions and every assertion.
          const originalFetch=globalThis.fetch;
          globalThis.fetch=async(...args)=>{await delay(1400);return originalFetch(...args);};
          console.log('Additional 1400ms pacing before each fetch; original bounded Retry-After handling retained.');
          await import('./verify.mjs');
          JS
          node paced-runner.mjs
      - name: Record scope
        if: always()
        run: |
          printf '%s\n' 'Read-only RPC allowlist; no keys, live requests, wallet approvals or transaction submission.' 'Pinned SDK fixture replays plus separately retrieved receipts and historical state. Historical block hashes corroborated through another documented endpoint; not consensus or finality proof.' 'Ownership bisection locates an observed transition, not complete ownership history or authorization of real-world controller identity. Provider approval remains false.' 'An additional 1400ms delay per HTTP request respects public provider limits without changing validation or ignoring requested backoff.' >> "$GITHUB_STEP_SUMMARY"

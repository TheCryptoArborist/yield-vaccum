name: Daily Draw operating-fee local integration
on:
  push:
    branches: [research/mss2-daily-draw-readiness]
    paths: [.github/workflows/daily-draw-operating-fees.yml]
permissions: {}
concurrency:
  group: daily-draw-operating-fees-research
  cancel-in-progress: false
jobs:
  fees:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [robinhood, arc]
    steps:
      - name: Fetch pinned research and provider sources into isolated temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/draw-fees/research/daily-draw" "$RUNNER_TEMP/draw-fees/sdk"
          cd "$RUNNER_TEMP/draw-fees"
          fetch() { curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 90 "$1" -o "$2"; }
          ROOT=https://raw.githubusercontent.com/TheCryptoArborist/yield-vaccum/4191025553887e301a7c36643bf64f9ab20b52d6
          fetch "$ROOT/scripts/daily-draw-operating-fees.mjs" runner.mjs
          fetch "$ROOT/scripts/daily-draw-fee-test-environment.mjs" daily-draw-fee-test-environment.mjs
          fetch "$ROOT/research/daily-draw/DailyDrawOperatingFeesPrototype.sol" research/daily-draw/DailyDrawOperatingFeesPrototype.sol
          test "$(git hash-object runner.mjs)" = f4dd0b95323d0ffcee2d07c046dfedf78dcc5a95
          test "$(git hash-object daily-draw-fee-test-environment.mjs)" = 58de49be9ef50b3c199cfa72763fe30b380b671d
          test "$(git hash-object research/daily-draw/DailyDrawOperatingFeesPrototype.sol)" = 37c4a19ae733387c41bf10b18d21334b9f2e6ef8
          fetch https://codeload.github.com/d20dao/d20-sdk/tar.gz/fc4b546c06017703b0508ef2182d2030d789c966 provider.tar.gz
          tar -xzf provider.tar.gz --strip-components=1 -C sdk
          test "$(git hash-object sdk/protocol/contracts/D20VRFCoordinator.sol)" = 1eb9bdd5831a4bda7635760ca78fc48553034fb7
          test "$(git hash-object sdk/protocol/contracts/robinhood/D20VRFCoordinatorRobinhood.sol)" = b107fcb9a2d1dc4aed173f9381a6030bb261979e
          test "$(git hash-object sdk/protocol/contracts/EpochEntropy.sol)" = 5bbbfa296748202da0c710729d16b51d868d13ce
          test "$(git hash-object sdk/scripts/fixtures/drand-evmnet/rounds.json)" = fdd79a6052014b7389fe1621613fa3b694253f72
          node --check runner.mjs
          node --check daily-draw-fee-test-environment.mjs
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact ethers@6.15.0 hardhat@2.26.3 solc@0.8.28 @openzeppelin/contracts@5.6.1 @openzeppelin/contracts-upgradeable@5.6.1 @d20dao/vrf-sdk@0.6.2 @noble/curves@1.9.7
          sha256sum package-lock.json
      - name: Exercise operating-fee budgets against actual provider code locally
        shell: bash
        env:
          LOCAL_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/draw-fees"
          node runner.mjs "$LOCAL_MODE" | tee run.log
      - name: Preserve results and resolved dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-draw-fees-${{ matrix.mode }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/draw-fees/evidence/*.json
            ${{ runner.temp }}/draw-fees/run.log
            ${{ runner.temp }}/draw-fees/package.json
            ${{ runner.temp }}/draw-fees/package-lock.json
            ${{ runner.temp }}/draw-fees/runner.mjs
            ${{ runner.temp }}/draw-fees/daily-draw-fee-test-environment.mjs
            ${{ runner.temp }}/draw-fees/research/daily-draw/DailyDrawOperatingFeesPrototype.sol
      - name: Record scope
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'Local native operating funds only. No public RPC, live tickets, keys, approvals, real swaps or payouts.' 'Actual provider source, public test VRF scalar and recorded historical beacon signatures. Not a live keeper request, native-Arc accounting or security audit.' 'New fee component is not yet wired into the original DailyDrawPrototype. Prices, splits, payers and limits have no approved production values.' 'Refund-account rejection is explicitly injected in one local recovery scenario, then the original account code is restored byte-for-byte. Module and coordinator code are not changed.' >> "$GITHUB_STEP_SUMMARY"

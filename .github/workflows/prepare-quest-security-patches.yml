name: Prepare Quests branch security patches
on:
  push:
    branches: [feature/mss2-quests-foundation]
    paths: [.github/workflows/prepare-quest-security-patches.yml]
permissions:
  contents: read
jobs:
  patch:
    if: github.ref == 'refs/heads/feature/mss2-quests-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/mss2-quests-foundation
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply explicit same-major framework security versions
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.1 react@19.2.9 react-dom@19.2.9
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.4.1
          npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Commit only dependency manifests to the review branch and remove this one-use workflow
        run: |
          test "$(git branch --show-current)" = feature/mss2-quests-foundation
          git add package.json package-lock.json
          git rm .github/workflows/prepare-quest-security-patches.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Patch Next.js and React on the Quests review branch'
          git push origin HEAD:refs/heads/feature/mss2-quests-foundation

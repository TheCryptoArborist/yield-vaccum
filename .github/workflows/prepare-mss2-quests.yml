name: Prepare MSS2 Quests integration branch
on:
  push:
    branches: [feature/mss2-quests-foundation]
    paths:
      - scripts/integrate-mss2-quests.mjs
      - .github/workflows/prepare-mss2-quests.yml
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/mss2-quests-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mss2-quests-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check guarded source integration
        run: node --test tests/quests-integration.test.mjs
      - name: Integrate the homepage, arcade navigation, and styles
        run: node scripts/integrate-mss2-quests.mjs
      - name: Save only the integration changes to this review branch
        run: |
          git add app/page.tsx app/arcade/lobby/lobby.tsx app/layout.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate MSS2 Quests into home and arcade navigation'
            git push origin HEAD:refs/heads/feature/mss2-quests-foundation
          fi

name: MSS2 Quests review checks
on:
  pull_request:
    paths:
      - app/**
      - lib/**
      - db/**
      - netlify/database/migrations/**
      - tests/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/mss2-quests-checks.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: npm ci
      - name: Quest source integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/quests-integration.test.mjs
      - name: Quest catalog tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --import tsx --test tests/quests.test.ts
      - name: Verified participation and database tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --import tsx --test tests/quest-pilot.test.ts
      - name: Full regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit
